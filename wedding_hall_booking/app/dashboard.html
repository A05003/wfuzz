<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة إدارة القاعة</title>
<link rel="stylesheet" href="dashboard.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="dashboard.html" aria-label="الرئيسية">
    <span class="brand-mark">♛</span>
    <span class="brand-text"><b>قصر الأفراح</b><small>إدارة العقود والتصفية</small></span>
  </a>

  <div class="search" role="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" autocomplete="off" placeholder="بحث سريع: رقم العقد أو اسم العميل أو الجوال   ( / )" aria-label="بحث سريع عن عقد" aria-controls="results" aria-expanded="false">
    <ul id="results" class="results hidden" role="listbox"></ul>
  </div>

  <div class="clock" id="clock" aria-live="off" title="التاريخ والوقت الآن">
    <time id="clockTime">--:--:--</time>
    <span><span id="clockDate"></span><span class="sep">·</span><span id="clockHijri"></span></span>
  </div>

  <div class="user">
    <span class="avatar" id="avatar">م</span>
    <div class="user-meta">
      <b id="userName">المالك</b>
      <select id="roleSwitch" aria-label="تبديل الدور (عرض تجريبي)">
        <option value="owner">المالك (Super Admin)</option>
        <option value="manager">مدير القصر</option>
      </select>
    </div>
  </div>
</header>

<nav class="maintabs" aria-label="الأقسام">
  <button data-view="dash" class="active">لوحة التحكم</button>
  <button data-view="audit">سجل التدقيق <span class="lock" id="auditLock" title="للمالك فقط">🔒</span></button>
</nav>

<main id="view"></main>

<aside id="panel" class="panel hidden" aria-label="تفاصيل العقد"></aside>
<div id="panelShade" class="shade hidden"></div>
<div id="modalRoot"></div>
<div id="toast" class="toast" role="status"></div>

<script src="dashboard.js"></script>
</body>
</html>
